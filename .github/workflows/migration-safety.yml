name: Migration safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: migration-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-schema:
    name: Fresh schema and migration guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cue_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cue_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cue_ci
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cue_ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply clean schema and migrations
        run: node scripts/db-setup.mjs --fresh --confirm-fresh

      - name: Verify Field Ops schema
        run: npm run db:field-ops

      - name: Test migration runner and guards
        run: npm run test:run-sql
